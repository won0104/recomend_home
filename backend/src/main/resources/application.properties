spring.application.name=ssafy-home
spring.config.import=optional:file:./application-secret.properties,optional:classpath:application-secret.properties

logging.level.com.ssafy=info

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# MySQL datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafy_home?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# MyBatis
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.type-aliases-package=com.ssafy.prj.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Multipart (file upload)
spring.servlet.multipart.location=${user.home}/uploads
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Static resources caching off in dev
spring.web.resources.cache.cachecontrol.no-cache=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.show-login-endpoint=false
springdoc.paths-to-match=/api/**

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
logging.level.org.springframework.batch=info
logging.level.com.ssafy.prj.batch=debug

# Estate market batch
batch.estate.enabled=true
batch.estate.cron=0 0 8 * * MON-FRI
# Use ALL for production-wide collection, or comma-separated codes such as 11110,11680.
# Keep this small for local startup tests.
batch.estate.lawd-codes=11110
batch.estate.lawd-cd=11110
# Blank means recent months based on batch.estate.months. You can also set comma-separated months such as 202604,202603.
batch.estate.deal-ymd=
batch.estate.months=1
batch.estate.page-size=100
# 0 means keep requesting pages until the API returns an empty/short page.
batch.estate.max-pages=2
# 0 means no total item cap. Set a small number such as 300 for quick testing.
batch.estate.max-items=200
batch.estate.api-url=https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade


# Public Data Portal RTMS apartment trade API key.
# This is separate from batch.ai.api-key.
batch.estate.api-key=${ESTATE_API_KEY:}
batch.estate.force-api=true
batch.estate.pdf-dir=${user.home}/ssafy-home-reports

# AI summary API. Leave api-key empty to use a deterministic local fallback summary.
batch.ai.api-key=${AI_API_KEY:}
batch.ai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
batch.ai.model=gpt-4o-mini
