spring.application.name=ssafy-home
spring.config.import=optional:file:./application-secret.properties,optional:classpath:application-secret.properties

logging.level.com.ssafy=info

# 문자 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# MySQL 데이터 소스
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafy_home?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=ssafy_home
spring.datasource.password=ssafy_home

# JWT 비밀키는 application-secret.properties 또는 환경변수 JWT_SECRET에 둔다.
jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-please}
jwt.access-expiration-seconds=900
jwt.refresh-expiration-seconds=604800

# MyBatis
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.type-aliases-package=com.ssafy.prj.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Redis 기반 챗봇 세션 상태 저장 설정
# Redis는 Docker/WSL/로컬 설치 중 어떤 방식으로 실행해도 되고, 기본값은 localhost:6379이다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 챗봇 대화 이력과 상태의 유지 시간이다. 기본값 168시간은 7일을 의미한다.
chat.redis.ttl-hours=${CHAT_REDIS_TTL_HOURS:168}
# 세션별로 Redis list에 보관할 최근 메시지 최대 개수다.
chat.redis.max-history-size=${CHAT_REDIS_MAX_HISTORY_SIZE:40}
# RAG 문서 디렉터리를 외부에서 지정할 때 사용한다. 비워두면 generated/rag/seoul-gugun 기본 경로를 탐색한다.
chat.rag.seoul-gugun-dir=${CHAT_RAG_SEOUL_GUGUN_DIR:}
# RAG 상세설명에서 사용자 질문과 문서 chunk의 embedding 유사도 검색을 사용할지 여부다.
# embedding 호출이 실패하면 자동으로 키워드 기반 검색으로 대체한다.
chat.rag.embedding.enabled=${CHAT_RAG_EMBEDDING_ENABLED:true}
# 상세설명 답변에 사용할 RAG 검색 결과 개수다.
chat.rag.search.top-k=${CHAT_RAG_SEARCH_TOP_K:7}
# OpenAI embedding 모델 설정이다. GMS/OpenAI 호환 서버에서 지원하는 모델명으로 바꿀 수 있다.
spring.ai.openai.embedding.options.model=${AI_EMBEDDING_MODEL:text-embedding-3-small}

# 파일 업로드
spring.servlet.multipart.location=${user.home}/uploads
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 개발 환경에서는 정적 리소스 캐시를 사용하지 않음
spring.web.resources.cache.cachecontrol.no-cache=true

# Swagger / OpenAPI 설정
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.show-login-endpoint=false
springdoc.paths-to-match=/api/**

# Spring Batch 설정
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
logging.level.org.springframework.batch=info
logging.level.com.ssafy.prj.batch=debug

# 아파트 매매 실거래가 배치
batch.estate.enabled=true
batch.estate.cron=0 0 8 * * MON-FRI
# 최초 수집 범위: 인접한 종로구(11110), 중구(11140)
# 이후 서울 전체를 수집하려면 lawd-codes를 주석 처리하고 sido-name 주석을 해제한다.
# batch.estate.sido-name=서울특별시
batch.estate.lawd-codes=11110,11140
batch.estate.lawd-cd=
# 수집 기간: 2025년 1월부터 12월까지
batch.estate.deal-ymd=202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512
batch.estate.months=12
batch.estate.page-size=1000
# 0이면 API가 빈 목록 또는 마지막 페이지를 반환할 때까지 계속 요청한다.
batch.estate.max-pages=0
# 0이면 전체 수집 건수 제한이 없다. 빠른 테스트 시에는 300처럼 작은 값을 설정한다.
batch.estate.max-items=0
batch.estate.api-url=https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade


# 공공데이터포털 아파트 매매 실거래가 API 키 (AI 요약 API 키와 별도)
batch.estate.api-key=${ESTATE_API_KEY:}
batch.estate.force-api=true
batch.estate.pdf-dir=${user.home}/ssafy-home-reports

# 아파트별 좌표 보강: 매매 API에 없는 좌표를 카카오 주소→좌표 API로 한 번만 채운다.
# KAKAO_REST_API_KEY는 application-secret.properties에 넣고, 브라우저용 JavaScript 키와 분리한다.
batch.estate.geocoding.enabled=true
batch.estate.geocoding.api-url=https://dapi.kakao.com/v2/local/search/address.json
batch.estate.geocoding.api-key=${KAKAO_REST_API_KEY:}
# 외부 API 요청이 한꺼번에 몰리지 않도록 각 주소 요청 뒤 25ms를 기다린다.
batch.estate.geocoding.delay-ms=25

# 아파트 전월세 실거래가 배치
# 매매 배치와 분리되어 있으며, 처음에는 서버 재시작만으로 실행되지 않게 비활성화한다.
# 최초 수집 전에 enabled·run-on-startup을 true로 바꾸고, 적재가 끝나면 run-on-startup은 다시 false로 둔다.
batch.estate-rent.enabled=true
batch.estate-rent.run-on-startup=false
batch.estate-rent.cron=0 30 3 * * SUN
# 매매와 같은 범위(종로구·중구)로 시작한다. 서울 전체 수집 시 lawd-codes를 주석 처리하고 아래 주석을 해제한다.
batch.estate-rent.lawd-codes=11110,11140
batch.estate-rent.lawd-cd=
# batch.estate-rent.sido-name=서울특별시
batch.estate-rent.deal-ymd=202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512
batch.estate-rent.months=12
batch.estate-rent.page-size=1000
# 0이면 마지막 페이지까지 모두 수집한다. 빠른 연결 확인은 1 또는 작은 값으로 제한할 수 있다.
batch.estate-rent.max-pages=0
batch.estate-rent.max-items=0
batch.estate-rent.api-url=https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent
# 매매와 같은 공공데이터포털 키를 사용한다.
batch.estate-rent.api-key=${ESTATE_API_KEY:}

# 상권 통계 배치 (소상공인시장진흥공단 API)
# I2(카페·외식), R1(문화·스포츠), Q1(의료), G205(식료품), G204(종합 소매),
# G220(반려동물용품), M111(동물병원)을 수집한다.
# 다른 업종을 수집하려면 CommercialMetricCategory에 항목을 추가한다.
# 로컬 환경에 COMMERCIAL_API_KEY를 설정하기 전까지는 비활성화 상태로 유지한다.
batch.commercial.enabled=false
batch.commercial.run-on-startup=false
batch.commercial.cron=0 0 4 * * MON
batch.commercial.api-url=https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInDong
# COMMERCIAL_API_KEY를 우선 사용한다. 동일한 공공데이터포털 키가 상권 API 권한도 갖고 있다면
# ESTATE_API_KEY를 재사용할 수 있다.
batch.commercial.api-key=${COMMERCIAL_API_KEY:${ESTATE_API_KEY:}}
batch.commercial.region-code=11
batch.commercial.page-size=1000

# AI 요약 API. 키가 비어 있으면 정해진 규칙 기반의 로컬 대체 요약을 사용한다.
batch.ai.api-key=${AI_API_KEY:}
batch.ai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
batch.ai.model=gpt-4o-mini

# Chatbot LLM and Kakao location API
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
