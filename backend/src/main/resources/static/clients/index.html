<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>부동산 거래정보 AI 챗봇</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <div class="header">
        <span>부동산 거래정보 AI</span>
        <button class="upload-btn" type="button" id="toggle-upload-btn">
          문서 추가
        </button>
      </div>

      <div id="upload-panel" class="upload-panel hidden">
        <div class="upload-content">
          <p>문서를 업로드하면 챗봇이 해당 내용을 참고해 답변합니다.</p>
          <p class="file-types">지원 형식: .txt, .md, .pdf</p>
          <div id="upload-form">
            <input
              type="file"
              id="file-input"
              name="file"
              accept=".txt,.md,.pdf" />
            <button type="button" id="upload-btn">업로드</button>
          </div>
        </div>
      </div>

      <div id="chat-window" class="chat-window">
        <div class="message bot">
          안녕하세요. 부동산 거래 정보에 대해 궁금한 점을 물어보세요.
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="질문을 입력하세요." />
        <button type="button" id="send-btn">전송</button>
      </div>
    </div>

    <script src="script_v4.js"></script>
  </body>
</html>
